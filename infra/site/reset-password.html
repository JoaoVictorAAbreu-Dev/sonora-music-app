<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Sonora · Redefinir senha</title>
    <style>
      /* Colors from packages/tokens (dark theme). */
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        background: #1b1d23;
        color: #fffbea;
        font: 17px/24px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        max-width: 480px;
        margin: 0 auto;
        padding: 64px 16px;
        text-align: center;
      }
      h1 {
        font-size: 28px;
        line-height: 34px;
      }
      p {
        color: #aba89e;
      }
      a.button {
        display: inline-block;
        margin-top: 16px;
        padding: 12px 24px;
        border-radius: 999px;
        background: #f5891f;
        color: #1b1d23;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Redefinir senha</h1>
      <p>Abra este link no celular em que o Sonora está instalado.</p>
      <a id="open" class="button" href="sonora://reset-password">Abrir o Sonora</a>
      <p id="missing" hidden>Este link está incompleto. Peça um novo link no app.</p>
    </main>
    <script>const m = /(?:^#|&)token=([^&]+)/.exec(location.hash);
const link = document.getElementById('open');
if (m) {
  link.href = 'sonora://reset-password?token=' + m[1];
  location.replace(link.href);
} else {
  link.hidden = true;
  document.getElementById('missing').hidden = false;
}</script>
  </body>
</html>
