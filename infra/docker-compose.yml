# Production stack for one Compute Engine VM. Only Caddy is reachable from the internet.
# Usage on the VM (from infra/):  docker compose --env-file .env up -d
name: sonora

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sonora}
      POSTGRES_USER: ${POSTGRES_USER:-sonora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    image: ${API_IMAGE:-sonora-api:local}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-sonora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sonora}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      APP_VERSION: ${APP_VERSION:-unknown}
      TRUST_PROXY_HOPS: 1
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-900}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-2592000}
      AUTH_RATE_LIMIT_PER_IP: ${AUTH_RATE_LIMIT_PER_IP:-30}
      AUTH_RATE_LIMIT_PER_EMAIL: ${AUTH_RATE_LIMIT_PER_EMAIL:-10}
      JAMENDO_CLIENT_ID: ${JAMENDO_CLIENT_ID:-}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-none}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      APPLE_CLIENT_IDS: ${APPLE_CLIENT_IDS:-}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-sonora://reset-password}
      CATALOG_RATE_LIMIT_PER_USER: ${CATALOG_RATE_LIMIT_PER_USER:-120}
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
