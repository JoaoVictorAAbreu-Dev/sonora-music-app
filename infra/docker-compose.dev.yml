# Local development database only. The API runs on the host with `pnpm --filter @sonora/api dev`.
name: sonora-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sonora
      POSTGRES_USER: sonora
      POSTGRES_PASSWORD: sonora_dev_password
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

volumes:
  pgdata_dev:
